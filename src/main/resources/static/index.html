<!DOCTYPE html>
<html>
<head>
    <title>TruthTrace — Digital Forensic Dossier</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Georgia", serif;
            background: #0c0c0c;
            color: #ddd;
            height: 100vh;
            overflow: hidden;
        }

        /* ===== SMOKE LAYER ===== */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: url("https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1500&q=80") center/cover no-repeat;
            opacity: 0.05;
            filter: grayscale(100%) contrast(140%);
            animation: smokeDrift 60s linear infinite alternate;
            z-index: 0;
        }

        @keyframes smokeDrift {
            from { transform: scale(1) translateY(0px); }
            to { transform: scale(1.1) translateY(-30px); }
        }

        /* ===== MAIN CONTAINER ===== */
        .container {
            position: relative;
            z-index: 2;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 30px 60px;
        }

        /* ===== HEADER ===== */
        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 48px;
            letter-spacing: 6px;
            margin: 0;
            color: #e5e5e5;
            text-shadow: 0 0 10px rgba(255,255,255,0.2);
        }

        .subtitle {
            font-size: 12px;
            letter-spacing: 2px;
            color: #888;
        }

        /* ===== INPUT ===== */
        .input-row {
            display: flex;
            gap: 15px;
            margin: 20px 0 30px 0;
        }

        input {
            flex: 1;
            padding: 14px;
            background: #111;
            border: 1px solid #333;
            color: #ddd;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #777;
        }

        button {
            padding: 14px 30px;
            background: #222;
            border: 1px solid #444;
            color: #eee;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 2px;
            transition: all 0.3s ease;
        }

        button:hover {
            background: #333;
        }

        /* ===== LAYOUT ===== */
        .content {
            flex: 1;
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 30px;
            overflow: hidden;
        }

        /* ===== LEFT PANEL ===== */
        .left-panel {
            background: rgba(20,20,20,0.9);
            border: 1px solid #2a2a2a;
            padding: 25px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .threat-score {
            font-size: 70px;
            font-weight: bold;
            color: #f5f5f5;
        }

        .risk-label {
            font-size: 18px;
            margin-top: 10px;
        }

        .checklist {
            margin-top: 30px;
            font-size: 14px;
            line-height: 1.8;
            color: #aaa;
        }

        .checklist-item.completed {
            color: #d4d4d4;
        }

        /* ===== RIGHT PANEL ===== */
        .right-panel {
            background: rgba(18,18,18,0.95);
            border: 1px solid #2a2a2a;
            padding: 30px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .pipeline {
            font-size: 13px;
            color: #888;
            height: 140px;
            overflow-y: auto;
            margin-bottom: 20px;
        }

        .explanation {
            flex: 1;
            overflow-y: auto;
            font-size: 15px;
            line-height: 1.6;
            color: #ddd;
            padding-right: 10px;
        }

        .explanation::-webkit-scrollbar,
        .pipeline::-webkit-scrollbar {
            width: 6px;
        }

        .explanation::-webkit-scrollbar-thumb,
        .pipeline::-webkit-scrollbar-thumb {
            background: #444;
        }

        strong {
            color: #fff;
        }

    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>TRUTHTRACE</h1>
        <div class="subtitle">DIGITAL FORENSIC INVESTIGATION DOSSIER</div>
    </div>

    <div class="input-row">
        <input id="urlInput" placeholder="Enter suspect URL...">
        <button onclick="analyze()">INITIATE INVESTIGATION</button>
    </div>

    <div class="content">

        <div class="left-panel">
            <div>
                <div class="threat-score" id="threatScore">0</div>
                <div class="risk-label" id="riskLabel">Awaiting analysis</div>
            </div>

            <div class="checklist">
                <div class="checklist-item">□ Infrastructure Validation</div>
                <div class="checklist-item">□ Domain Reputation Scan</div>
                <div class="checklist-item">□ External Threat Intelligence</div>
                <div class="checklist-item">□ Content Extraction</div>
                <div class="checklist-item">□ Linguistic Manipulation Analysis</div>
                <div class="checklist-item">□ AI Contextual Interpretation</div>
            </div>
        </div>

        <div class="right-panel">
            <div class="pipeline" id="pipeline"></div>
            <div class="explanation" id="explanation"></div>
        </div>

    </div>

</div>

<script>
    async function analyze() {

        const url = document.getElementById("urlInput").value;
        const scoreDiv = document.getElementById("threatScore");
        const labelDiv = document.getElementById("riskLabel");
        const pipelineDiv = document.getElementById("pipeline");
        const explanationDiv = document.getElementById("explanation");
        const checklistItems = document.querySelectorAll(".checklist-item");

        if (!url) return;

        scoreDiv.innerText = "0";
        labelDiv.innerText = "Analyzing...";
        pipelineDiv.innerHTML = "";
        explanationDiv.innerHTML = "";

        checklistItems.forEach(item => {
            item.classList.remove("completed");
            item.innerHTML = item.innerHTML.replace("✓", "□");
        });

        const response = await fetch("/analyze", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ url })
        });

        const data = await response.json();

        let current = 0;
        const interval = setInterval(() => {
            current += 2;
            if (current >= data.threatScore) {
                current = data.threatScore;
                clearInterval(interval);
                labelDiv.innerText = "Risk Level: " + data.overallRisk;
            }
            scoreDiv.innerText = current;
        }, 40);

        data.pipeline.forEach((step, i) => {
            setTimeout(() => {
                const div = document.createElement("div");
                div.innerText = "• " + step;
                pipelineDiv.appendChild(div);

                if (i < checklistItems.length) {
                    checklistItems[i].classList.add("completed");
                    checklistItems[i].innerHTML =
                        checklistItems[i].innerHTML.replace("□", "✓");
                }

            }, i * 600);
        });

        setTimeout(() => {
            explanationDiv.innerHTML =
                data.explanation
                    .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
                    .replace(/\n/g, "<br>");
        }, data.pipeline.length * 600 + 500);
    }
</script>

</body>
</html>
